<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0E1A" />
    <title>Workers Ball 2026 · Harvesters Gbagada</title>
    <meta
      name="description"
      content="Harvesters International Christian Centre, Gbagada Campus — Workers Ball 2026. A black-tie celebration of honour, excellence, and dedicated service. Register and claim your official Gala Pass."
    />

    <!-- Open Graph / Facebook / WhatsApp / iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Harvesters International Christian Centre" />
    <meta property="og:title" content="Workers Ball 2026 · Harvesters Gbagada" />
    <meta
      property="og:description"
      content="A Black-Tie Celebration of Excellence, Honour & Dedicated Service. Register and claim your official Workers Ball 2026 Gala Pass."
    />
    <meta property="og:image" content="/wb26-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Workers Ball 2026 · Harvesters Gbagada" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Workers Ball 2026 · Harvesters Gbagada" />
    <meta
      name="twitter:description"
      content="A Black-Tie Celebration of Excellence, Honour & Dedicated Service. Register and claim your official Workers Ball 2026 Gala Pass."
    />
    <meta name="twitter:image" content="/wb26-og.jpg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Permissions-Policy"
      content="geolocation=(), microphone=(), camera=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), speaker=()"
    />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Body font: fetch in parallel with the CSS instead of after it. Vite
         rewrites this to the same hashed file the @font-face rule uses. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/geist-sans/files/geist-sans-latin-400-normal.woff2"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
